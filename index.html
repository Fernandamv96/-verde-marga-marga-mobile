    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .phone-frame {
      width: 390px;
      height: 844px;
      background: #1a1a1a;
      border-radius: 54px;
      padding: 12px;
      box-shadow:
        0 0 0 3px #2d2d2d,
        0 0 0 6px #1a1a1a,
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 0 0 2px #3d3d3d;
      position: relative;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #00C896 0%, #00A8E8 100%);
      border-radius: 44px;
      overflow: hidden;
      position: relative;
    }

    .phone-notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 34px;
      background: #1a1a1a;
      border-radius: 24px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .notch-speaker {
      width: 60px;
      height: 6px;
      background: #2d2d2d;
      border-radius: 3px;
    }

    .notch-camera {
      width: 12px;
      height: 12px;
      background: #1a1a2e;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px #2d2d2d;
    }

    .phone-home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: white;
      border-radius: 3px;
      opacity: 0.8;
    }

    .phone-button-left {
      position: absolute;
      left: -3px;
      top: 120px;
      width: 3px;
      height: 40px;
      background: #2d2d2d;
      border-radius-left: 2px;
    }

    .phone-button-right-1 {
      position: absolute;
      right: -3px;
      top: 150px;
      width: 3px;
      height: 80px;
      background: #2d2d2d;
    }

    .phone-button-right-2 {
      position: absolute;
      right: -3px;
      top: 240px;
      width: 3px;
      height: 60px;
      background: #2d2d2d;
    }

    .app-content {
      height: 100%;
      padding-top: 56px;
      padding-bottom: 85px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .app-content::-webkit-scrollbar { display: none; }

    .bottom-nav {
      position: absolute;
      bottom: 20px;
      left: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 8px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border-radius: 20px;
      transition: all 0.3s;
      cursor: pointer;
      border: none;
      background: transparent;
    }

    .nav-item.active {
      background: linear-gradient(135deg, #00C896, #00A8E8);
      color: white;
    }

    .nav-item:not(.active) {
      color: #6b7280;
    }

    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }

    .status-bar {
      position: absolute;
      top: 16px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: white;
      z-index: 50;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .gradient-card {
      background: linear-gradient(135deg, #00C896, #00A8E8);
      border-radius: 24px;
      padding: 24px;
      color: white;
      box-shadow:
        0 10px 40px rgba(0, 200, 150, 0.3),
        inset 0 -4px 12px rgba(0, 100, 75, 0.2),
        inset 0 4px 12px rgba(255, 255, 255, 0.2);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-float { animation: float 3s ease-in-out infinite; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Page transitions */
    .page { display: none; }
    .page.active { display: block; }

    .cursor-pointer { cursor: pointer; }
    .active\\:scale-95:active { transform: scale(0.95); }
    .transition-transform { transition: transform 0.15s ease; }
  </style>
</head>

function hideScanModal() {
  const modal = document.getElementById('scan-modal');

function startScan() {
  const content = document.getElementById('scan-content');
  const inner = document.getElementById('scan-inner');
  if (!content || !inner) return;

  content.innerHTML = '<h3 class="font-bold text-xl">Escaneando...</h3>';
  setTimeout(() => {
    content.innerHTML = '<h3 class="font-bold text-xl mb-1">Validando...</h3><p class="text-sm text-gray-500">Verificando en blockchain</p>';
    inner.innerHTML = '<span class="text-2xl animate-spin">⏳</span>';
    setTimeout(() => {
      content.innerHTML = '<h3 class="font-bold text-xl mb-2">¡Reciclaje Registrado!</h3><div class="bg-eco-green/10 rounded-2xl p-4 mb-2"><p class="font-bold text-2xl">1.2 kg</p><p class="text-eco-green font-bold">+18 EP</p></div><button onclick="hideScanModal()" class="gradient-card w-full py-3 rounded-2xl font-semibold text-white cursor-pointer">Continuar</button>';
      inner.innerHTML = '<span class="text-3xl">✅</span>';
    }, 1500);
  }, 1500);
}

function navigateTo(page) {
  currentPage = page;
  const appContent = document.getElementById('app-content');
  if (appContent && pages[page]) {
    appContent.innerHTML = pages[page]();
  }

  // Update nav items
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.remove('active');
    if (item.dataset.page === page) {
      item.classList.add('active');
    }
  });
}

  });

  // Load initial page
  navigateTo('home');
});

<script>
/**

 * 使用方法：

(function () {

  }

<script>
// Initialize floating ball functionality
function initFloatingBall() {
  const ball = document.getElementById('minimax-floating-ball');
  if (!ball) return;

  // Initial animation
  ball.style.opacity = '0';
  ball.style.transform = 'translateY(20px)';

  setTimeout(() => {
    ball.style.opacity = '1';
    ball.style.transform = 'translateY(0)';
  }, 500);

  // Handle logo click
  const ballContent = ball.querySelector('.minimax-ball-content');
  ballContent.addEventListener('click', function (e) {
    e.stopPropagation();
    window.open('https://agent.minimax.io/', '_blank');
    ball.style.transform = 'scale(0.95)';
    setTimeout(() => {
      ball.style.transform = 'scale(1)';
    }, 100);
  });

  // Handle close button click
  const closeIcon = ball.querySelector('.minimax-close-icon');
  closeIcon.addEventListener('click', function (e) {
    e.stopPropagation();
    ball.style.opacity = '0';
    ball.style.transform = 'translateY(20px)';

    setTimeout(() => {
      ball.style.display = 'none';
    }, 300);
  });
}

// Initialize when DOM is ready
document.addEventListener('DOMContentLoaded', initFloatingBall); 
</script>
